[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peekcli"
version = "0.1.0"
description = "A local macOS inspector for your terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
peek = "peekcli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
peekcli = ["wordmark.txt", "locales/*.json"]
